<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url("../../fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#0e0f10;font-family:P,sans-serif;color:#fff;overflow:hidden}
.top{padding:90px 72px 0}
.top small{font:800 32px/1 P;color:#1fd8a4;letter-spacing:.02em}
.top h1{margin-top:20px;font:900 96px/1.05 P;letter-spacing:-.045em}
.pn{margin:48px 48px 0;background:#fff;color:#0e0f10;border-radius:44px;padding:30px 44px}
.hd,.r{display:grid;grid-template-columns:1fr 250px 220px;align-items:center}
.hd{font:800 28px/1 P;color:#8a9096;padding:6px 0 18px;border-bottom:3px solid #0e0f10}
.hd span:nth-child(n+2){text-align:right}
.r{padding:30px 0;border-bottom:2px solid #e3e7e5}.r:last-child{border:0}
.r b{font:800 44px/1.1 P;letter-spacing:-.035em}.r b em{display:block;margin-top:8px;font:700 26px/1 P;color:#8a9096;font-style:normal}
.r strong{text-align:right;font:900 54px/1 P;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.r strong small{font-size:.55em}
.r i{justify-self:end;width:180px;height:72px;border-radius:20px;border:3px dashed #b8bfbb}
.tip{margin:40px 72px 0;font:700 34px/1.45 P;color:#c9cdd1;letter-spacing:-.02em;word-break:keep-all}
.tip mk{color:#1fd8a4;font-weight:900}
.ft{position:absolute;left:72px;right:72px;bottom:64px;font:600 22px/1.4 P;color:#7d8488;word-break:keep-all}
.ft b{color:#fff;font-weight:900}.ft b i{color:#1fd8a4;font-style:normal}
</style></head><body>

</body></html>
