# 매일 아침 07:00·밤 22:00(한국 시각) 최근 2주 게시물 반응을 재서 media 브랜치 stats/ 에 쌓음. (GitHub 예약은 30분~1시간 늦게 돌 때가 많아서 일찍 잡음)
# 아침 게시(08:10) 전에 어제 것까지 정리돼 있어서, 출근길에 피드백 보고 오늘 세트를 고칠 수 있음.
name: insights
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: media 브랜치 가져오기
        run: git fetch -q origin media && git worktree add -q -B media media FETCH_HEAD
      - name: 반응 수집
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node insights.mjs media
      - name: 저장
        run: |
          git config user.name "seum-bot"; git config user.email "bot@seum.invalid"
          cd media && git add -A && (git diff --cached --quiet || git commit -qm "stats $(TZ=Asia/Seoul date +%F_%H%M)") && git push -q origin media
