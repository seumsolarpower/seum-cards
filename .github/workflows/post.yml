# 07:08~23:38(한국 시각) 30분마다 깨어나서, 승인됐고 게시 시각("at")이 지난 세트를 인스타·스레드·X에 올림.
# 올릴 게 없으면 카드도 안 찍고 바로 끝남. 수동 실행(workflow_dispatch)은 올릴 게 없어도 카드를 찍어 Artifacts(cards-날짜)에 남김 → 폰으로 확인.
# GitHub 예약 실행은 늦게 돌 때가 많아서, 실제 게시는 "at" 보다 몇 분~30분 정도 늦을 수 있음.
# 인스타·스레드는 공개 이미지 주소가 필요해서 카드 JPG를 media 브랜치에 올리고 raw.githubusercontent 주소를 씀 (저장소가 공개여야 함).
# 릴스 영상은 reel 워크플로로 따로 만듦 (유행 음원은 인스타 앱에서 직접 붙여 올림).
name: post
on:
  schedule:
    - cron: "8,38 0-14,22,23 * * *"
  workflow_dispatch:
    inputs:
      date: { description: "날짜 YYYY-MM-DD (비우면 오늘)", required: false, default: "" }
      platforms: { description: "올릴 곳", required: false, default: "instagram,threads,x" }
      dry: { description: "1이면 올리지 않고 확인만", required: false, default: "0" }
permissions:
  contents: write
concurrency: post
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 날짜
        run: |
          D="${{ inputs.date }}"; [ -n "$D" ] || D=$(TZ=Asia/Seoul date +%F)
          echo "D=$D" >> $GITHUB_ENV
          if [ -f "content/$D.json" ]; then echo "HAS=1" >> $GITHUB_ENV; else echo "content/$D.json 없음 → 쉼"; fi
      - name: 올릴 차례인 세트 확인 (+ 지난 게시 기록 가져오기)
        if: env.HAS == '1'
        run: |
          if git ls-remote --exit-code --heads origin media >/dev/null; then git fetch -q origin media && git worktree add -q -B media media FETCH_HEAD
          else git worktree add -q --orphan -b media media; fi
          mkdir -p "out/$D"; [ -d "media/$D/posted" ] && cp -r "media/$D/posted" "out/$D/" || true
          N=$(CHECK=1 node publish.mjs "$D"); echo "올릴 세트 $N개"
          if [ "$N" != "0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "GO=1" >> $GITHUB_ENV; fi
      - uses: actions/setup-node@v4
        if: env.GO == '1'
        with: { node-version: 22 }
      - if: env.GO == '1'
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium && node test.mjs
      - name: 카드 찍기
        if: env.GO == '1'
        run: node render.mjs "$D" && node preview.mjs "$D" && node profile.mjs
      - uses: actions/upload-artifact@v4
        if: env.GO == '1'
        with: { name: "cards-${{ env.D }}", path: "out/${{ env.D }}/*.jpg\nout/${{ env.D }}/preview.html\nout/profile.png", overwrite: true }
      - name: 이미지를 media 브랜치에 올리기
        if: env.GO == '1'
        run: |
          git config user.name "seum-bot"; git config user.email "bot@seum.invalid"
          mkdir -p "media/$D" && cp out/"$D"/*.jpg "media/$D/"
          cd media && git add -A && (git diff --cached --quiet || git commit -qm "cards $D") && git push -q origin media
      - name: 게시
        if: env.GO == '1'
        env:
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/media
          PLATFORMS: ${{ inputs.platforms || 'instagram,threads,x' }}
          DRY: ${{ inputs.dry || '0' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node publish.mjs "$D"
      - name: 게시 기록 저장 (두 번 안 올리게)
        if: always() && env.GO == '1'
        run: |
          [ -d "out/$D/posted" ] || exit 0
          mkdir -p "media/$D" && cp -r "out/$D/posted" "media/$D/"
          cd media && git add -A && (git diff --cached --quiet || git commit -qm "posted $D") && git push -q origin media
