# 릴스 시안만 따로 만들어 봄 (게시 안 함). 목소리 비교용: voices 에 edge-tts 목소리를 쉼표로.
# 결과: Artifacts(reels-날짜) 에 mp4 + 정지 화면
name: reel
on:
  workflow_dispatch:
    inputs:
      date: { description: "날짜 YYYY-MM-DD", required: true }
      set: { description: "세트 id (비우면 전부)", required: false, default: "" }
      cutbg: { description: "누끼 짤 바탕 (panel | none)", required: false, default: "panel" }
      voices: { description: "목소리 (예: ko-KR-SunHiNeural,ko-KR-InJoonNeural). 비우면 무음", required: false, default: "" }
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pipx install edge-tts >/dev/null
      - name: 릴스 만들기
        env:
          VOICES: ${{ inputs.voices }}
          CUTBG: ${{ inputs.cutbg }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: node reel.mjs "${{ inputs.date }}" "${{ inputs.set }}"
      - name: DM 정리 이미지
        run: 'if [ -d "content/${{ inputs.date }}-dm" ]; then node shot.mjs "content/${{ inputs.date }}-dm" "out/${{ inputs.date }}/dm"; fi'
      - uses: actions/upload-artifact@v4
        with: { name: "reels-${{ inputs.date }}-${{ inputs.cutbg }}", path: "out/${{ inputs.date }}/*.mp4\nout/${{ inputs.date }}/reel-stills/\nout/${{ inputs.date }}/dm/" }
